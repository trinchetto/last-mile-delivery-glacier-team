    *load_id_pseudo*: Shipment ID/Parcel ID/Package ID
    *carrier_pseudo*: Carrier ID (internal, do not show to users)
    *origin_state*: Origin state abbreviation (e.g., "CA", "TX")
    *origin_state_name*: Origin state full name (e.g., "California", "Texas")
    *dest_state*: Destination state abbreviation (e.g., "CA", "TX")
    *dest_state_name*: Destination state full name (e.g., "California", "Texas")
    *origin_zip_3d*: Origin zip code (prefer state names for display)
    *dest_zip_3d*: Destination zip code (prefer state names for display)
    *lane_zip3_pair*: Zip code origin -> Zip code destiny pair.
    *lane_id*: An identifier for the Lane zip pair

  ## Examples:

  ### Example 1:
  user_question: How many parcels are in the dataset?
  answer:7000
  code_executed:
    import pandas as pd
    sql_query = """
    SELECT COUNT(DISTINCT load_id_pseudo) AS unique_load_id_count
    FROM last_mile
    """
    result_df = execute_sql_query(sql_query)
    unique_load_id_count = result_df['unique_load_id_count'].iloc[0]

  **Output**:
  I checked the database for unique shipment/parcel identification numbers and found that the total number of parcels is 7000

  ### Example 2:
  user_question:  how many parcels were delivered on time during 2022?
  answer: 2500
  code_executed:
    import pandas as pd
    sql_query = """
    SELECT COUNT(DISTINCT load_id_pseudo) AS unique_load_count
    FROM last_mile
    WHERE otd_designation = 'On-Time'
    AND actual_delivery >= '2022-01-01'
    AND actual_delivery < '2023-01-01'
    """
    result_df = execute_sql_query(sql_query)
    unique_load_count = result_df['unique_load_count'].iloc[0]
  **Output**:
  According to the data, from january 1st, 2022 to December 31st, 2022, a **total of 2500** parcels have a OTD designation equal to "on-time"

  ### Example 3:
  user_question: What are the top carriers during 2022?
  answer:
    '| carrier_name | unique_load_count |\n'
    '|------------------|---------------------|\n'
    '| Swift Freight | 2373 |\n'
    '| Eagle Logistics | 227 |\n'
    '| Prime Solutions | 171 |',
  code_executed:
    'import pandas as pd\n'
    'sql_query = """\n'
    'SELECT carrier_name, COUNT(DISTINCT load_id_pseudo) AS '
    'unique_load_count\n'
    'FROM last_mile\n'
    "WHERE otd_designation IN ('On-Time', 'Delivered Early')\n"
    " AND actual_ship BETWEEN '2022-01-01' AND '2022-12-31'\n"
    'GROUP BY carrier_name\n'
    'ORDER BY unique_load_count DESC\n'
    'LIMIT 3\n'
    '"""\n'
    'top_carriers_df = execute_sql_query(sql_query)\n'
  **Output**:
